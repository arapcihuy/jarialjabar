name: Deploy to Hosting
# Deploy FTP dimatikan dari push sampai kredensial hosting diperbaiki (issue #1).
# Alasannya: secret FTP_USERNAME/FTP_PASSWORD terakhir diubah 28 Jan 2026 dan
# server menjawab 530 Login incorrect, jadi setiap push ke main hanya
# menghasilkan run merah tanpa satu file pun tersinkron. Workflow ini tidak
# dihapus: setelah password FTP diganti dan secret diperbarui, cukup kembalikan
# blok `push` di bawah atau jalankan lewat tombol Run workflow.
on:
  workflow_dispatch: # deploy manual; aktifkan lagi trigger push setelah secret benar

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v5

      - name: 🔎 Cek secrets FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v kosong. Isi di Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Deploy dibatalkan: secret FTP belum lengkap."
            exit 1
          fi
          echo "Ketiga secret FTP terisi."

      # Diagnosa tidak memblokir deploy: sumber kebenaran tetap langkah Sync
      # di bawah. Tujuannya hanya membuat pesan gagal spesifik (530 vs
      # jaringan diblokir vs host cuma menerima SFTP) alih-alih error samar
      # dari library FTP.
      - name: 🩺 Diagnosa koneksi FTP
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, os, socket

          raw = os.environ.get("FTP_SERVER", "").strip()
          host = raw
          for scheme in ("ftp://", "ftps://", "sftp://"):
              if host.lower().startswith(scheme):
                  host = host[len(scheme):]
          host = host.split("/")[0]
          if ":" in host and not host.startswith("["):
              host, _, p = host.partition(":")
              port = int(p) if p.isdigit() else 21
          else:
              port = 21

          if raw != host:
              print(f"::warning::Nilai secret FTP_SERVER berisi skema atau path ({raw!r}); yang dipakai hanya host/port. Sebaiknya simpan {host!r} saja.")

          user = os.environ.get("FTP_USERNAME", "")
          pwd = os.environ.get("FTP_PASSWORD", "")

          ftp = ftplib.FTP()
          try:
              ftp.connect(host, port, timeout=20)
          except (socket.timeout, OSError) as e:
              print(f"::error::Tidak bisa membuka TCP ke {host}:{port} ({e.__class__.__name__}: {e}). "
                    "Artinya bukan soal password: port 21 diblokir dari runner GitHub, "
                    "atau akun hosting hanya menerima SFTP (port 22) / FTPS eksplisit, "
                    "atau nama host di secret salah.")
              raise SystemExit(0)
          print(f"TCP {host}:{port} tersambung. Banner: {ftp.getwelcome()!r}")
          try:
              ftp.login(user, pwd)
          except ftplib.error_perm as e:
              print(f"::error::Server menolak login: {e}. Kode 530 = username/password salah atau akun FTP dinonaktifkan. "
                    "Perbaiki kredensial di panel hosting, lalu update secret FTP_USERNAME / FTP_PASSWORD.")
              raise SystemExit(0)
          except Exception as e:
              print(f"::error::Login gagal: {e.__class__.__name__}: {e}")
              raise SystemExit(0)
          print("Login FTP berhasil, kredensial valid. Deploy dilanjutkan.")
          try:
              print("Direktori awal:", ftp.pwd())
          except Exception:
              pass
          ftp.quit()
          PY

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # protocol: ftp # Biarkan auto-detect
          security: loose # Penting untuk shared hosting (Hostinger/Niagahoster)
          port: 21
          # Folder di hosting (langsung ke root FTP akun ini)
          server-dir: ./
          # Folder di proyek kita (root)
          local-dir: ./
          # File yang tidak perlu di-upload
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            .vscode/**
            test/**
